<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="stylesheet" href="%sveltekit.assets%/styles/modern-css-reset/reset.min.css" />
		<link rel="stylesheet" href="%sveltekit.assets%/styles/style.css" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- サイト全体で変わらない設定（アイコン・マニフェスト・テーマ色）。
		     ページごとの情報（タイトル・説明・OGP）は各ページの <svelte:head> に書く -->
		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="%sveltekit.assets%/assets/icons/apple-touch-icon.png"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="%sveltekit.assets%/assets/icons/favicon-32x32.png"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="16x16"
			href="%sveltekit.assets%/assets/icons/favicon-16x16.png"
		/>
		<link rel="shortcut icon" href="%sveltekit.assets%/assets/icons/favicon.ico" />
		<link
			rel="mask-icon"
			href="%sveltekit.assets%/assets/icons/safari-pinned-tab.svg"
			color="#5bbad5"
		/>
		<link rel="manifest" href="%sveltekit.assets%/manifest.json" />
		<meta name="apple-mobile-web-app-title" content=".Spectrum" />
		<meta name="application-name" content=".Spectrum" />
		<meta name="msapplication-TileColor" content="#ffffff" />
		<meta name="msapplication-config" content="%sveltekit.assets%/assets/icons/browserconfig.xml" />
		<meta name="theme-color" content="#ffffff" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
